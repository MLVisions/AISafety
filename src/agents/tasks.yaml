# =========================================================================
# CONTENT MAINTENANCE TASKS
# =========================================================================

content_validation_task:
  description: >
    Validate all website content for accuracy, currency, and citation quality.
    Check all external links and verify source accessibility.

    Validation checklist:
    1. Verify all statistical claims and data points
    2. Check all external links for accessibility
    3. Ensure consistent citation formatting (direct URLs, not references.md anchors)
    4. Identify content that may be outdated
    5. Flag any unsupported claims or opinions presented as facts

    Files to validate: index.md, economy.md, technology.md, llm.md,
    privacy.md, society.md, action.md, references.md

  expected_output: >
    Content validation report with file-by-file accuracy assessment,
    broken links, citation issues, and outdated content.

content_update_task:
  description: >
    Update website content based on research findings and validation results.
    Maintain consistent tone, structure, and editorial quality.

    Output MUST be structured JSON with updates array.  Each update uses one of:
    statistic_update, content_addition, content_deletion, clarification, or
    section_rewrite.  Only include updates with confidence > 0.7.

  expected_output: >
    Structured JSON with validated content updates including exact text
    replacements, additions, and deletions with full citations and
    confidence scores.

reference_sync_task:
  description: >
    Synchronize references.md with all citations used across the website.
    Ensure academic formatting and verify source accessibility.
    
    Synchronization process:
    1. Extract all citations from updated content files
    2. Verify each source URL is accessible
    3. Format citations according to academic standards
    4. Organize references by topic/section
    5. Remove citations no longer used in content
    6. Add new citations from updated content
    
    Ensure references.md accurately reflects all sources used
    across the website and maintains professional academic standards.
    
  expected_output: >
    Updated references.md file with:
    - All current citations properly formatted
    - Verified accessible source URLs
    - Organized by topic sections
    - Removed outdated/unused references
    - Academic formatting consistency

# INFRASTRUCTURE TASKS
market_data_update_task:
  description: >
    Fetch current market data for charts and visualizations.
    Update data files used for economic analysis plots.
    
    Data requirements:
    1. Update stock market indices (S&P 500, major tech stocks)
    2. Refresh cryptocurrency data (Bitcoin, Ethereum)
    3. Update economic indicators (inflation, employment)
    4. Fetch AI investment and adoption metrics
    5. Refresh comparative wealth analysis data
    
    Ensure all data is current, accurate, and properly formatted
    for the website's visualization system.
    
  expected_output: >
    Updated data files with:
    - Current market data (within 24 hours)
    - Proper CSV formatting for visualization system
    - Data quality validation results
    - Summary of changes from previous update

website_build_task:
  description: >
    Execute complete website build after content and data updates.
    Validate build success and verify all functionality.
    
    Build process:
    1. Execute main build.py script
    2. Verify all HTML files generated correctly
    3. Check that all assets (images, CSS, JS) are copied
    4. Validate internal links and navigation
    5. Test responsive design and key functionality
    6. Generate build success report
    
    Ensure the website builds successfully and all functionality
    is preserved after content updates.
    
  expected_output: >
    Build completion report with:
    - Build success/failure status
    - Generated file inventory
    - Validation results for key functionality
    - Any errors or warnings encountered
    - Recommendations for deployment