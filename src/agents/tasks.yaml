# AI Safety Website Task Configuration
# Section-specific task definitions -- each task targets a single H2 section
# on a single page so the research agent has a narrow, well-defined scope.

# =========================================================================
# ECONOMY PAGE  (economy.md)
# =========================================================================

economy_macro_task:
  description: >
    TARGET SECTION: "## Macroeconomic Landscape"

    Research the current macroeconomic environment as it affects
    individuals and households.  Lead with the most recent data,
    then provide enough historical context (2-3 years) to show the
    trajectory.  Do NOT dwell on 2020-2021 pandemic-era data.

    Topics to cover (each with current figures and trend direction):
    - Inflation: CPI/PCE trends, categories driving inflation (housing,
      food, energy, services), how purchasing power is eroding.
    - Federal Reserve policy: current fed funds rate, forward guidance,
      rate-cut timeline and market expectations.
    - Labor market: unemployment rate, job openings, hiring trends by
      sector, wage growth vs inflation, AI-driven displacement signals.
    - Housing: mortgage rates, home prices, affordability metrics,
      rental market pressures.
    - Equity markets: S&P 500 and Nasdaq performance, market breadth
      and concentration risk in AI/tech mega-caps, valuations.
    - Consumer sentiment and spending: savings rates, credit card
      delinquencies, consumer confidence indices.
    - Recession indicators: yield curve, leading economic indicators,
      GDP growth trajectory.

    For EVERY claim provide a direct source URL and date.
    Use section_rewrite if the section is substantially outdated.

  expected_output: >
    Structured JSON updating "Macroeconomic Landscape" with current
    economic data affecting households and individuals.  Every fact
    must link to its authoritative source.

economy_geopolitics_task:
  description: >
    TARGET SECTION: "## Geopolitical & Market Risks"

    Research geopolitical developments and systemic market risks that
    threaten economic stability.  This section should help readers
    understand risks they may not see in mainstream financial coverage.
    Lead with current and imminent risks.

    Topics to cover:
    - Oil and energy: current oil prices, OPEC+ decisions, supply
      disruptions from conflicts or sanctions, energy cost pass-through
      to consumers and businesses.
    - Yen carry trade: current state of USD/JPY carry trade, Bank of
      Japan rate normalization, risk of forced unwind and contagion to
      global equity and credit markets.  Reference the mid-2024 episode.
    - Trade wars and tariffs: current tariff schedules, retaliatory
      measures, impact on supply chains and consumer prices.
    - Sanctions and financial fragmentation: Russia/China sanctions
      regime, BRICS de-dollarization efforts, SWIFT alternatives.
    - Emerging market stress: currency crises, capital flight, sovereign
      debt concerns.
    - Black swan indicators: geopolitical flashpoints, financial system
      leverage, liquidity conditions.

    For EVERY claim provide a direct source URL and date.
    Use section_rewrite if the section is substantially outdated.

  expected_output: >
    Structured JSON updating "Geopolitical & Market Risks" with current
    risk assessments and geopolitical developments.  Source every claim.

economy_policy_task:
  description: >
    TARGET SECTION: "## Policy & Regulation"

    Research legislative, executive, and regulatory actions that shape
    markets, technology adoption, and the financial system.  Flag
    anything in the current section described as pending that has since
    been enacted (or defeated), and add any new major policies.

    Topics to cover:
    - AI policy: executive orders, the AI Action Plan, OBBBA bill, and
      any new federal AI legislation or agency guidance.
    - Digital asset regulation: GENIUS Act status, CLARITY Act,
      stablecoin rules, Strategic Bitcoin Reserve updates, SEC/CFTC
      enforcement and guidance.
    - Trade policy: tariff schedules, reciprocal duties, trade deals
      and their inflation / supply-chain impact.
    - Fiscal policy: budget negotiations, deficit and debt ceiling
      concerns, spending priorities.
    - Monetary policy: Fed communications, rate path, balance sheet.
    - International frameworks: EU AI Act milestones, MiCA regulation,
      UK, China, and other national strategies.

    For EVERY claim provide a direct source URL, bill/order number where
    applicable, and date.  Use section_rewrite when materially aged.

  expected_output: >
    Structured JSON updating "Policy & Regulation" with current
    legislative and regulatory developments.  Source every claim.

economy_financial_infra_task:
  description: >
    TARGET SECTION: "## Financial System Evolution"

    Research how blockchain and digital-asset protocols are becoming
    financial infrastructure ("the plumbing").  This is NOT about price
    speculation or investment hype.  Frame everything as educational
    background about the structural transition occurring in finance.

    Topics to cover:
    - Cross-border payments: XRP/Ripple institutional adoption, RLUSD
      stablecoin, partnerships with banks and payment providers,
      Stellar (XLM) remittance and CBDC pilot programs.
    - Real-world asset tokenization: Ondo Finance (ONDO) tokenizing
      Treasuries and money market funds, broader RWA tokenization
      market size and growth projections, institutional platforms.
    - Data oracles and interoperability: Chainlink (LINK) connecting
      smart contracts to real-world data and bank APIs, Hedera (HBAR)
      enterprise use cases in supply chain and tokenization.
    - Stablecoin infrastructure: combined market cap, usage in global
      payments, regulatory frameworks (GENIUS Act, MiCA).
    - CBDCs: global development status, U.S. Anti-CBDC Act, interplay
      between private stablecoins and government digital currencies.
    - Traditional finance integration: bank custody services, tokenized
      securities platforms, institutional DeFi adoption.

    IMPORTANT: Do NOT frame this as investment advice.  Frame it as
    "here is how the financial system is evolving" educational content.
    Mention Bitcoin only where factually relevant (e.g. Strategic
    Reserve, ETF infrastructure) but do not center the section on it.

    For EVERY claim provide a direct source URL and date.
    Use section_rewrite when materially aged.

  expected_output: >
    Structured JSON updating "Financial System Evolution" with current
    financial infrastructure developments.  Source every claim.

economy_strategy_task:
  description: >
    TARGET SECTION: "## Strategic Recommendations"

    Synthesize the macroeconomic landscape, geopolitical risks, policy
    developments, and financial system evolution into updated guidance.
    This section helps readers think through preparation, risk
    management, and financial awareness.  It is NOT financial advice;
    frame it as a discussion framework.

    Topics to cover:
    - Risk assessment: what are the biggest near-term threats to
      household financial stability (inflation erosion, job displacement,
      market correction, geopolitical shock).
    - Diversification principles: why concentration in any single asset
      class or sector is risky in the current environment.
    - Inflation protection: real assets, high-yield savings, TIPS,
      commodities as purchasing-power preservers.
    - Career and skills: how macro trends and AI adoption affect job
      markets and what sectors offer resilience.
    - Geopolitical awareness: why oil prices, carry trades, and tariffs
      matter for everyday financial decisions.
    - Financial infrastructure literacy: understanding the digital
      transition not as speculation but as context for where finance
      is heading.
    - Short / medium / long-term outlook (3 / 12 / 36 months).

    For EVERY claim provide a direct source URL and date.
    Use section_rewrite when materially aged.

  expected_output: >
    Structured JSON updating "Strategic Recommendations" with a
    current preparation-focused discussion framework.  Source every claim.

