# AI Safety Website - Writing Style Guidelines
# All writing agents MUST follow these rules to ensure consistent voice across pages.

voice:
  tone: professional
  perspective: third-person informational with occasional second-person ("you") for actionable advice
  audience: general public seeking to understand and prepare for AI-driven change
  register: accessible but authoritative; avoid jargon unless defined in context

punctuation:
  em_dashes: never  # Do NOT use em dashes (—). Use commas, semicolons, colons, or rewrite.
  en_dashes: only for numeric ranges (e.g., 2024-2025, 10-15%)
  hyphens: standard compound modifiers (e.g., AI-driven, long-term)
  oxford_comma: always  # Use the serial comma before "and"/"or" in lists
  exclamation_marks: avoid  # Reserve for rare, genuinely surprising data points

formatting:
  headings: sentence case (e.g., "Understanding the economic cycle")
  bold: use sparingly for key statistics, names of acts/policies, and critical findings
  italics: source attributions (e.g., *(Goldman Sachs, 2023)*) and figure captions
  lists: >
    REQUIRED when presenting 3 or more data points, statistics, metrics,
    or parallel items.  Do NOT bury multiple statistics in a single prose
    paragraph; extract them into a bulleted list with bold key figures.
  numbers: spell out one through nine; use numerals for 10+, percentages, and dollar amounts
  formatting_variety: >
    Every section MUST use a mix of formatting.  No section should be
    100% prose paragraphs or 100% bullet lists.  Follow this pattern:
    1. Open with a short narrative paragraph (2-3 sentences) that frames
       the topic and provides context or a key takeaway.
    2. Present supporting data, evidence, or items as a bulleted list.
       Each bullet should lead with a bold key metric or term.
       Sections with 3 or more data points MUST extract them into bullets.
    3. Optionally close with a brief narrative paragraph for analysis,
       interpretation, or transition to the next topic.

    GOOD example:
      Inflation continues to cool but remains above the Fed's 2% target,
      with shelter costs driving most of the overshoot.

      - **CPI rose 2.8% year-over-year** in March 2026 [*(BLS, 2026)*](https://www.bls.gov/news.release/cpi.nr0.htm)
      - **Core PCE at 2.6%**, down from 3.1% a year earlier [*(BEA, 2026)*](https://www.bea.gov/news/...)
      - **Shelter inflation at 4.3%**, the largest single contributor
      - **Energy costs fell 0.2%**, providing mild relief

      The trajectory suggests the Fed may begin easing later in 2026,
      though services inflation remains sticky.

    BAD example (all stats buried in prose):
      Consumer prices rose 2.8% with core PCE at 2.6% while shelter
      rose 4.3% and food rose 2.1% and energy fell 0.2% which
      suggests the Fed may begin easing.

citations:
  inline_format: >
    Use a light citation style.  Bold only the key metric or finding,
    NOT the entire sentence.  Link the source attribution tag (not the
    full claim sentence) to the authoritative URL.

    IN BULLET LISTS — bold the leading metric, plain-text the context,
    link the source tag:
      - **CPI rose 2.8% year-over-year** in March 2026 [*(BLS, 2026)*](https://www.bls.gov/news.release/cpi.nr0.htm)

    IN PROSE — link only the key claim phrase, keep the rest plain:
      Consumer prices [rose 2.8%](https://www.bls.gov/news.release/cpi.nr0.htm)
      over the 12 months ending February 2026 *(BLS, 2026)*.

    BAD (too heavy — do NOT bold+link the entire sentence):
      **[Consumer prices rose 2.8% over the 12 months ending February 2026](url)** *(BLS, 2026)*

    NEVER link to references.md or references.html with anchors.
    Always use the direct https:// URL of the source.
    The references page is auto-generated from these direct links.
  every_claim: true  # Every statistical or factual claim MUST include a citation
  preferred_sources:
    - government (e.g., BLS, Fed, SEC, EU Commission)
    - academic (e.g., peer-reviewed journals, university research)
    - financial (e.g., Bloomberg, Reuters, S&P)
    - tech_industry (e.g., OpenAI, Google DeepMind, Anthropic official publications)
  avoid: blog posts, opinion columns, anonymous sources, unverified social media

content_rules:
  no_financial_advice: >
    Always include a disclaimer when discussing investment strategies.
    Use language like "These recommendations are not financial advice but provide
    a framework for discussion."
  balance: present risks alongside opportunities; avoid hype or fear-mongering
  temporal_coverage: >
    Content should feel current and informative. Always lead with the most recent
    data and developments, then provide historical context spanning the last 5-10
    years for perspective. A reader should see current-year dates prominently
    alongside any historical narrative. Flag older claims with their publication
    year. Never let a section feel like it was written years ago.
  structure_preservation: >
    Do not remove or rename existing sections. Add detail within existing structure.
    New subsections may be added only when they clearly belong under an existing heading.
  length: prefer concise paragraphs (3-5 sentences); break long blocks into subsections

prohibited:
  - em dashes (—)
  - first-person plural ("we believe", "our view") except in mission statements
  - superlatives without evidence ("the best", "the worst", "unprecedented" unless cited)
  - clickbait phrasing ("you won't believe", "shocking")
  - gendered language when gender-neutral alternatives exist
